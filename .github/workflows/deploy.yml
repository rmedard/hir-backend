name: Build & Deploy HouseInRwanda

on:
  push:
    branches: [ "main", "staging" ]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ github.ref_name == 'main' && 'https://www.houseinrwanda.com' || 'https://dev.houseinrwanda.com' }}
    env:
      TMP_DIR: /home/C08945/tmp_cicd

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, json, gd, mbstring, zip
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: public_html/themes/custom/houseinrwanda_theme/package-lock.json

      - name: Install PHP dependencies
        run: |
          composer install --prefer-dist --no-dev --optimize-autoloader --no-interaction
          echo "✅ PHP dependencies installed"

      - name: Build theme assets
        working-directory: public_html/themes/custom/houseinrwanda_theme
        run: |
          npm ci --silent
          npm run build
          echo "✅ Theme assets built"

          # Verify TomSelect was built
          if [ -f "../../../libraries/tom-select/tom-select.complete.min.js" ] &&
             [ -f "../../../libraries/tom-select/tom-select.min.css" ]; then
            echo "✅ TomSelect files verified"
          else
            echo "❌ TomSelect files missing after build!"
            ls -la ../../../libraries/tom-select/ 2>/dev/null || echo "No tom-select directory"
            exit 1
          fi

      - name: Prepare deployment files
        run: |
          mkdir -p deployment-files

          # Copy everything with standard exclusions
          if [ -f ".deployignore" ]; then
            rsync -a --exclude-from='.deployignore' ./ deployment-files/
            echo "Using .deployignore file for exclusions"
          else
            rsync -a \
              --exclude='.git' \
              --exclude='.github' \
              --exclude='deployment-files' \
              --exclude='node_modules' \
              --exclude='public_html/sites/default' \
              --exclude='.ssh' \
              ./ deployment-files/
            echo "Using manual exclusions (no .deployignore found)"
          fi

          echo "✅ Deployment files prepared"
          du -sh deployment-files/

      - name: Transfer files to server via SCP
        uses: appleboy/scp-action@v1
        with:
          host: ${{ github.ref_name == 'main' && vars.PRODUCTION_HOST || vars.STAGING_HOST }}
          username: ${{ github.ref_name == 'main' && vars.PRODUCTION_USER || vars.STAGING_USER }}
          key: ${{ github.ref_name == 'main' && secrets.PRODUCTION_SSH_KEY || secrets.STAGING_SSH_KEY }}
          port: 22
          source: "deployment-files/*"
          target: "${{ env.TMP_DIR }}/${{ github.ref_name }}"
          strip_components: 1

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ github.ref_name == 'main' && vars.PRODUCTION_HOST || vars.STAGING_HOST }}
          username: ${{ github.ref_name == 'main' && vars.PRODUCTION_USER || vars.STAGING_USER }}
          key: ${{ github.ref_name == 'main' && secrets.PRODUCTION_SSH_KEY || secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            # Set deployment paths
            if [ "${{ github.ref_name }}" = "main" ]; then
              DEPLOY_PATH="${{ vars.PRODUCTION_DEPLOY_PATH }}"
            else
              DEPLOY_PATH="${{ vars.STAGING_DEPLOY_PATH }}"
            fi
            WEBROOT_PATH="$DEPLOY_PATH/public_html"
            TMP_DIR="${{ env.TMP_DIR }}"
            DEPLOY_TMP="$TMP_DIR/${{ github.ref_name }}"

            echo "=== DEPLOYING TO: $DEPLOY_PATH ==="

            # Safety checks
            if [ ! -d "$DEPLOY_PATH" ]; then
              echo "❌ Deploy path does not exist: $DEPLOY_PATH"
              exit 1
            fi

            # Rollback function — restores files AND database
            rollback() {
              echo "=== ROLLING BACK ==="
              if [ -n "$BACKUP_DIR" ] && [ -d "$BACKUP_DIR" ]; then
                rsync -a --quiet \
                  --exclude='public_html/sites/default' \
                  --exclude='.ssh' \
                  "$BACKUP_DIR/" "$DEPLOY_PATH/"
                echo "✅ Files rolled back from $BACKUP_DIR"
              else
                echo "❌ No file backup available for rollback"
              fi
              if [ -n "$DB_BACKUP" ] && [ -f "$DB_BACKUP" ] && \
                 [ -n "$PHP_BINARY" ] && [ -f "$DRUSH_PHP" ]; then
                echo "Restoring database from $DB_BACKUP..."
                if gunzip -c "$DB_BACKUP" | "$PHP_BINARY" "$DRUSH_PHP" sql:cli; then
                  echo "✅ Database rolled back"
                else
                  echo "❌ Database rollback failed — manual intervention required: $DB_BACKUP"
                fi
              fi
            }

            # Backup current deployment
            echo "Creating backup..."
            BACKUP_DIR="$TMP_DIR/backup-$(date +%Y%m%d-%H%M%S)"
            rsync -a --quiet \
              --exclude='public_html/sites/default' \
              --exclude='.ssh' \
              --exclude='.github' \
              --exclude='.git' \
              "$DEPLOY_PATH/" "$BACKUP_DIR/" 2>/dev/null && \
              echo "✅ Backup created: $BACKUP_DIR" || \
              echo "⚠️ Backup failed, continuing..."

            # Clean up old backups (keep last 3)
            ls -dt "$TMP_DIR"/backup-* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true

            # Create server-side exclusions to preserve critical files
            cat > "$TMP_DIR/server-rsync-excludes.txt" << 'EXCLUDES'
            dev.houseinrwanda.com
            public_html/sites/default
            tmp
            private
            .ssh
            .git
            .github
            cgi-bin
            document_errors
            logs
            stats
            EXCLUDES
            sed -i 's/^[[:space:]]*//' "$TMP_DIR/server-rsync-excludes.txt"

            # Check critical files before sync
            echo "Checking critical files before sync:"
            ls -la "$DEPLOY_PATH/public_html/sites/default/settings.php" 2>/dev/null && echo "✅ settings.php exists" || echo "⚠️ settings.php not found"
            ls -la "$DEPLOY_PATH/public_html/sites/default/services.yml" 2>/dev/null && echo "✅ services.yml exists" || echo "⚠️ services.yml not found"

            # Sync files (quiet mode — no per-file output)
            echo "Syncing files to deployment location..."
            rsync -a \
              --exclude-from="$TMP_DIR/server-rsync-excludes.txt" \
              --delete \
              "$DEPLOY_TMP/" "$DEPLOY_PATH/"

            # Verify critical files after sync
            echo "Checking critical files after sync:"
            ls -la "$DEPLOY_PATH/public_html/sites/default/settings.php" 2>/dev/null && echo "✅ settings.php preserved" || echo "❌ settings.php was deleted!"
            ls -la "$DEPLOY_PATH/public_html/sites/default/services.yml" 2>/dev/null && echo "✅ services.yml preserved" || echo "❌ services.yml was deleted!"

            echo "✅ Files synced, server configurations preserved"

            # Set permissions — targeted instead of full-tree find
            echo "Setting permissions..."
            chmod 755 "$DEPLOY_PATH" "$WEBROOT_PATH" 2>/dev/null || true

            # Set permissions only on newly synced code (exclude sites/default/files)
            find "$DEPLOY_PATH/vendor" "$DEPLOY_PATH/public_html/core" "$DEPLOY_PATH/public_html/modules" "$DEPLOY_PATH/public_html/themes" "$DEPLOY_PATH/public_html/libraries" \
              -type d -exec chmod 755 {} + 2>/dev/null &
            find "$DEPLOY_PATH/vendor" "$DEPLOY_PATH/public_html/core" "$DEPLOY_PATH/public_html/modules" "$DEPLOY_PATH/public_html/themes" "$DEPLOY_PATH/public_html/libraries" \
              -type f -exec chmod 644 {} + 2>/dev/null &
            wait

            # Set executable permissions for vendor binaries (single find)
            find "$DEPLOY_PATH/vendor" \( -path "*/bin/*" -o -name "drush" -o -name "drush.php" \) -type f -exec chmod 755 {} + 2>/dev/null

            # Ensure web server can write to files directory
            if [ -d "$WEBROOT_PATH/sites/default/files" ]; then
              chmod -R 775 "$WEBROOT_PATH/sites/default/files"
            fi

            echo "✅ Permissions set"

            # Verify TomSelect libraries from pre-built assets
            echo "Verifying theme assets..."
            if [ -f "$WEBROOT_PATH/libraries/tom-select/tom-select.complete.min.js" ] &&
               [ -f "$WEBROOT_PATH/libraries/tom-select/tom-select.min.css" ]; then
              echo "✅ TomSelect libraries verified"
            else
              echo "❌ CRITICAL: TomSelect libraries missing!"
              ls -la "$WEBROOT_PATH/libraries/tom-select/" 2>/dev/null || echo "No tom-select directory"
              rollback
              exit 1
            fi

            # Drush commands
            echo "=== RUNNING DRUSH COMMANDS ==="
            cd "$DEPLOY_PATH"

            # Detect PHP binary
            PHP_BINARY=""
            for php_version in 8.3 8.2 8.1; do
              PLESK_PHP="/opt/plesk/php/$php_version/bin/php"
              if [ -f "$PLESK_PHP" ] && [ -x "$PLESK_PHP" ]; then
                PHP_BINARY="$PLESK_PHP"
                echo "✅ Found Plesk PHP $php_version"
                break
              fi
            done

            if [ -z "$PHP_BINARY" ]; then
              for php_cmd in php8.3 php8.2 php8.1 php; do
                if command -v "$php_cmd" >/dev/null 2>&1; then
                  PHP_BINARY="$php_cmd"
                  echo "✅ Found system PHP: $php_cmd"
                  break
                fi
              done
            fi

            if [ -z "$PHP_BINARY" ]; then
              echo "❌ No compatible PHP version found (need PHP 8.1+)"
              rollback
              exit 1
            fi

            # Set up drush execution environment
            export COMPOSER_ALLOW_SUPERUSER=1
            export COMPOSER_DISABLE_XDEBUG_WARN=1
            export COMPOSER_PLATFORM_CHECK=0

            DRUSH_PHP="$DEPLOY_PATH/vendor/drush/drush/drush.php"
            if [ ! -f "$DRUSH_PHP" ]; then
              echo "❌ Drush not found at: $DRUSH_PHP"
              rollback
              exit 1
            fi

            run_drush() {
              $PHP_BINARY "$DRUSH_PHP" "$@"
            }

            # Verify Drush works
            echo "Testing Drush..."
            if run_drush --version >/dev/null 2>&1; then
              echo "✅ Drush verified and ready"
            else
              echo "❌ Drush test failed"
              rollback
              exit 1
            fi

            # Backup database before any schema changes
            DB_BACKUP="$BACKUP_DIR/db-pre-deploy.sql.gz"
            echo "Backing up database to $DB_BACKUP..."
            if run_drush sql:dump --gzip --result-file="$DB_BACKUP" 2>&1; then
              echo "✅ Database backed up"
            else
              echo "❌ Database backup failed — refusing to continue"
              DB_BACKUP=""
              rollback
              exit 1
            fi

            # Enable maintenance mode for the migration window
            echo "Enabling maintenance mode..."
            run_drush sset system.maintenance_mode 1 -y || true
            run_drush cr 2>&1 || true

            # Canonical Drupal deploy: updb → cache:rebuild → config:import → cache:rebuild → deploy:hook
            echo "Running drush deploy..."
            if run_drush deploy -y 2>&1; then
              echo "✅ Deploy completed"
            else
              echo "❌ Deploy failed"
              run_drush sset system.maintenance_mode 0 -y || true
              rollback
              exit 1
            fi

            # Disable maintenance mode and rebuild caches
            echo "Disabling maintenance mode...!"
            run_drush sset system.maintenance_mode 0 -y || true
            if run_drush cr 2>&1; then
              echo "✅ Cache rebuilt"
            else
              echo "❌ Cache rebuild failed"
              rollback
              exit 1
            fi

            # Clean up
            echo "=== CLEANING UP ==="
            rm -rf "$DEPLOY_TMP"
            rm -f "$TMP_DIR/server-rsync-excludes.txt"
            echo "✅ Temporary files cleaned up"

            # Final verification
            echo "=== DEPLOYMENT VERIFICATION ==="
            echo "Deployed to: $DEPLOY_PATH"

            [ -f "$WEBROOT_PATH/sites/default/settings.php" ] && echo "✅ settings.php preserved" || echo "❌ settings.php missing!"
            [ -d "$WEBROOT_PATH/sites/default/files" ] && echo "✅ files directory preserved" || echo "❌ files directory missing!"
            [ -d "$WEBROOT_PATH/libraries/tom-select" ] && echo "✅ TomSelect libraries deployed" || echo "❌ TomSelect libraries missing!"

            if run_drush status --field=bootstrap 2>/dev/null | grep -q "Successful"; then
              echo "✅ Drupal bootstrap successful"
            else
              echo "⚠️ Drupal bootstrap check failed"
            fi

            echo ""
            echo "🎉 DEPLOYMENT COMPLETED SUCCESSFULLY! 🎉"
            echo "Site should be accessible at: ${{ github.ref_name == 'main' && 'https://www.houseinrwanda.com' || 'https://dev.houseinrwanda.com' }}"
